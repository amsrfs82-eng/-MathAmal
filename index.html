<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محكمة الرياضيات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--p:#5b2a9e;--pd:#34115f;--pk:#ff7ab8;--g:#f5c242;--w:#fff;--bg:#f6ecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 50% 0,#8b4fd6,#3b1470 70%);color:var(--pd);min-height:100vh;background-color:#3b1470}
#bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--pd);color:#fff;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--g)}
#bar b{font-size:1.1rem;color:var(--g)}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(#ff9acb,#d9468f);color:#fff;border:3px solid var(--g);border-radius:16px;padding:12px 20px;font-size:1.1rem;font-weight:800;box-shadow:0 6px 0 #8f2a5c;margin:6px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8f2a5c}
.btn.s{padding:6px 12px;font-size:.95rem;box-shadow:0 3px 0 #8f2a5c;margin:2px}
.btn.v{background:linear-gradient(#9b62e0,#5b2a9e);box-shadow:0 6px 0 #34115f}
.btn:disabled{opacity:.45}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.card{background:#fff;border:4px solid var(--g);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 8px 24px #0004}
h1,h2{margin:.3em 0;text-align:center}
h2{color:#fff;text-shadow:0 2px 0 #0006}
.card h2{color:var(--p);text-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.cls{flex:1 1 220px;border-radius:22px;padding:18px;text-align:center;color:#fff;font-size:1.3rem;font-weight:800;border:4px solid var(--g);box-shadow:0 8px 0 #0004;cursor:pointer}
.cls i{display:block;font-style:normal;font-size:3.4rem}
.bubble{background:#fff;border:3px solid var(--g);border-radius:18px;padding:10px 14px;font-weight:800;min-height:48px;position:relative}
.stage{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
@media(max-width:600px){.stage{grid-template-columns:1fr}.judge.sm{max-width:110px;margin:auto}}
.judge{width:100%;max-width:200px;display:block;margin:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.gv{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-40deg)}
.judge.hit .gv{animation:strike .5s}
@keyframes strike{0%{transform:rotate(-70deg)}60%{transform:rotate(20deg)}100%{transform:rotate(-40deg)}}
.board{background:#2b1a4d;border:8px solid #b9822f;border-radius:16px;color:#fff;padding:16px;text-align:center;box-shadow:inset 0 0 30px #000a}
.expr{font-size:2.6rem;font-weight:800;direction:rtl;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tk{padding:2px 12px;border-radius:12px;min-width:34px}
.tk.op{background:#ffffff22;border:2px dashed var(--g);cursor:pointer;color:var(--g)}
.tk.on{background:var(--g);color:var(--pd);box-shadow:0 0 22px var(--g);animation:glow .6s infinite alternate}
.tk.bad{animation:shake .4s}
@keyframes glow{to{transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.opt{display:block;width:100%;font-size:1.6rem;margin:8px 0}
.opt.ok{background:linear-gradient(#6ee7a0,#18a35a);box-shadow:0 6px 0 #0d6b3a}
.opt.no{background:#bbb;box-shadow:none;color:#666}
.steps{text-align:right;font-size:1.2rem;margin:8px 0;direction:rtl}
.steps div{background:#ffffff18;border-radius:10px;padding:4px 10px;margin:4px 0}
.prog{height:14px;background:#ffffff33;border-radius:9px;overflow:hidden;margin:6px 0}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--pk));transition:width .4s}
.chip{display:inline-block;background:#fff;color:var(--p);border:3px solid var(--g);border-radius:14px;padding:8px 14px;font-size:1.6rem;font-weight:800;margin:4px}
.chip.on{background:var(--g);animation:glow .6s infinite alternate}
.slot{animation:slide .6s}
@keyframes slide{from{transform:translateY(-40px);opacity:0}}
.stu{display:flex;gap:6px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 10px;margin:5px 0}
.stu .n{flex:1;font-weight:800;font-size:1.05rem}
input{font-family:inherit;font-size:1rem;padding:8px;border:2px solid var(--p);border-radius:10px;flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar i{height:22px;border-radius:11px;display:block}
.scene{position:relative;overflow:hidden;background:linear-gradient(#f0d9ff,#c89cf0 55%,#7a4a2b 55%);border:5px solid var(--g);border-radius:24px;padding:16px;text-align:center;min-height:420px}
.scene .t{font-size:3rem}
.bench{background:linear-gradient(#b9822f,#7a4a1b);height:46px;border-radius:12px 12px 0 0;margin:-30px auto 0;max-width:420px;position:relative;box-shadow:0 8px 0 #4a2a0b}
.fly{position:absolute;font-size:2.2rem;font-weight:800;color:var(--p);animation:fl 3.5s ease-out forwards;opacity:0}
@keyframes fl{0%{opacity:0;transform:translateY(0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translateY(-320px) rotate(360deg) scale(1.2)}}
.title{font-size:2.2rem;color:var(--p);font-weight:800;opacity:0;transition:.5s;transform:scale(.3)}
.title.show{opacity:1;transform:scale(1)}
.star{position:fixed;font-size:2rem;pointer-events:none;animation:st 1.4s ease-out forwards;z-index:9}
@keyframes st{to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
#modal .card{max-width:340px;text-align:center}
.cert{background:#fff;border:12px double var(--g);padding:30px;text-align:center;border-radius:10px;color:var(--p)}
.cert h1{font-size:2.2rem}.cert .nm{font-size:2.4rem;color:#d9468f;font-weight:800;border-bottom:3px solid var(--g);display:inline-block;padding:0 24px}
@media print{body{background:#fff}#bar,.np{display:none!important}.card{border:none;box-shadow:none}}
.judge .m{display:none}.judge .m-smile{display:inline}.judge.wow .m-smile,.judge.think .m-smile,.judge.cheer .m-smile{display:none}.judge.wow .m-wow,.judge.think .m-think,.judge.cheer .m-cheer{display:inline}.judge.wow .br{transform:translateY(-6px)}
.armL{transform-box:fill-box;transform-origin:100% 0}.judge.talk .armL,.judge.cheer .armL{animation:wave .5s infinite alternate}@keyframes wave{to{transform:rotate(-25deg)}}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:14px solid transparent;border-top:30px solid #f5c242;z-index:2;filter:drop-shadow(0 2px 2px #0006)}
textarea{border:2px solid var(--p);border-radius:10px;padding:8px;margin:6px 0}
img.judge{border:5px solid var(--g);border-radius:20px;box-shadow:0 8px 20px #0006;max-width:250px;background:#fff}img.judge.sm{max-width:170px}
img.judge.talk{animation:talk .45s infinite alternate}@keyframes talk{to{transform:scale(1.045) rotate(-1.2deg)}}
img.judge.cheer{animation:bounce .5s 4}@keyframes bounce{50%{transform:translateY(-16px) scale(1.05)}}
img.judge.think{animation:tilt 1s 2}@keyframes tilt{30%{transform:rotate(-4deg)}70%{transform:rotate(4deg)}}
img.judge.wow{animation:wowz .6s 2}@keyframes wowz{50%{transform:scale(1.08)}}
img.judge.hit{animation:hitimg .45s}@keyframes hitimg{30%{transform:translateY(10px) scale(1.06)}}
@keyframes zoom{30%{transform:scale(1.04)}}
#win:not(:empty){position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:15;padding:14px}#win .card{text-align:center;max-width:440px;margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const isOp=t=>t.length==1&&'+-×÷'.includes(t),tk=s=>s.match(/\d+|[+\-×÷()]/g),dsp=t=>t=='-'?'−':t;
function nx(t){let a=0,b=t.length-1;const o=t.indexOf('(');if(o>=0){const c=t.indexOf(')',o);if(t.slice(o,c).some(isOp)){a=o+1;b=c-1}}for(let i=a;i<=b;i++)if(t[i]=='×'||t[i]=='÷')return i;for(let i=a;i<=b;i++)if(t[i]=='+'||t[i]=='-')return i;return -1}
const ap=(x,o,y)=>o=='+'?x+y:o=='-'?x-y:o=='×'?x*y:x/y;
function stp(t,i){const x=+t[i-1],y=+t[i+1],o=t[i],r=ap(x,o,y),n=[...t.slice(0,i-1),String(r),...t.slice(i+2)];for(let j=0;j<n.length;j++)if(n[j]=='('&&n[j+2]==')')n.splice(j,3,n[j+1]);return{t:n,txt:`${x} ${dsp(o)} ${y} = ${r}`}}
function calc(s){let t=tk(s),i;while((i=nx(t))>=0)t=stp(t,i).t;return +t[0]}
function naive(s){const t=tk(s),n=t.filter(x=>!isOp(x)&&x!='('&&x!=')').map(Number),o=t.filter(isOp);let r=n[0];o.forEach((p,i)=>r=ap(r,p,n[i+1]));return r}

Object.assign(A,{spin(){if(G.spinning||!G.pool.length)return;G.spinning=true;$('#spb').disabled=true;$('#win').innerHTML='';const n=G.pool.length,sg=2*Math.PI/n,w=Math.floor(Math.random()*n),a0=G.ang||0,T=2*Math.PI;let tg=-Math.PI/2-(w+.2+Math.random()*.6)*sg;tg+=T*Math.ceil((a0-tg)/T)+T*(5+Math.floor(Math.random()*3));const t0=performance.now();let li=-1;const f=now=>{const p=Math.min(1,(now-t0)/5200),e=1-Math.pow(1-p,3),a=a0+(tg-a0)*e;G.ang=a;drawW(a);const ix=Math.floor((((-Math.PI/2-a)%T)+T)%T/sg);if(ix!==li){li=ix;SFX.tick()}if(p<1)requestAnimationFrame(f);else fin(w)};requestAnimationFrame(f)},wgo:()=>begin(),cyc(){S.classes[G.ci].done=[];save();G.ang=0;R.wheel()},cyc2(v){S.classes[+v].done=[];save();R.teach()},man:()=>go('stu'),xans:(v,b)=>{if(!G.open)return;const e=G.xq,O=document.querySelectorAll('.opt'),ex=()=>{$('#stp').innerHTML=`<div>🔎 تفسير الخطأ: ${ar(e.why)}</div>`;$('#nx').style.display='';O.forEach(x=>x.disabled=true);O[e.bad].classList.add('ok')};if(+v==e.bad){good();ex()}else{b.classList.add('no');b.disabled=true;G.tries++;SFX.no();face('think',2500);if(G.tries>=2){G.open=false;rec(false);say('لا بأس! لنكتشف الخطأ معًا.',300,'wx');ex()}else{const wi=Math.floor(Math.random()*WR.length);say(WR[wi],300,'no'+wi)}}},lnew:()=>{G.lq=null;R.live()},lshow:()=>{const q=G.lq;let h='';if(typeof q=='object')h=`<div>✔ الخطأ في الخطوة ${ar(q.bad+1)}</div><div>🔎 ${ar(q.why)}</div>`;else{let t=tk(q),i;while((i=nx(t))>=0){const r=stp(t,i);t=r.t;h+=`<div>${ar(r.txt)}</div>`}h+=`<div>✔ الجواب: ${ar(calc(q))} (الخيار ${'أبجد'[G.lo.indexOf(calc(q))]})</div>`}G.lrev=h;$('#stp').innerHTML=h},lpt:v=>{const[i,d]=v.split(',').map(Number),c=S.classes[i];c.bonus=Math.max(0,(c.bonus||0)+d);save();if(d>0){SFX.ok();stars()}R.live()},scl:v=>{G.sn=$('#sn').value;G.sc=+v;R.sname()},sgo:()=>{const n=$('#sn').value.trim();if(!n)return say('اكتبي اسمك أولًا.');if(G.sc==null)return say('اختاري فصلك أولًا.');const c=S.classes[G.sc];let i=c.st.findIndex(s=>s.n===n);if(i<0){c.st.push({n,
